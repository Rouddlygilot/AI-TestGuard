name: AI-TestGuard - Tests automatiques

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests Python et couverture
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Mettre à jour pip
        run: python -m pip install --upgrade pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le style avec Ruff
        run: ruff check app tests

      - name: Exécuter les tests et mesurer la couverture
        run: |
          pytest -v             --cov=app             --cov-report=term-missing             --cov-report=xml:coverage.xml

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture
          path: coverage.xml
          if-no-files-found: ignore
